
name: FAA NOTAM Initial Load Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-initial-load:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Test FAA initial-load response
        env:
          NMS_CLIENT_ID: ${{ secrets.NMS_CLIENT_ID }}
          NMS_CLIENT_SECRET: ${{ secrets.NMS_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import urllib.error

          host = "https://api-staging.cgifederal-aim.com"

          if not os.getenv("NMS_CLIENT_ID") or not os.getenv("NMS_CLIENT_SECRET"):
              raise SystemExit("Missing FAA credentials")

          import base64
          credentials = (
              os.environ["NMS_CLIENT_ID"] + ":" +
              os.environ["NMS_CLIENT_SECRET"]
          ).encode()
          basic = base64.b64encode(credentials).decode()

          print("Authenticating with FAA...", flush=True)

          token_request = urllib.request.Request(
              host + "/v1/auth/token",
              data=b"grant_type=client_credentials",
              headers={
                  "Authorization": "Basic " + basic,
                  "Content-Type": "application/x-www-form-urlencoded",
              },
              method="POST",
          )

          with urllib.request.urlopen(token_request, timeout=15) as response:
              import json
              token = json.load(response)["access_token"]

          print("FAA authentication successful", flush=True)
          print("Requesting DOMESTIC initial-load link...", flush=True)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          request = urllib.request.Request(
              host + "/nmsapi/v1/notams/il/DOMESTIC?allowRedirect=false",
              headers={
                  "Authorization": "Bearer " + token,
                  "nmsResponseFormat": "GEOJSON",
              },
          )

          try:
              response = opener.open(request, timeout=30)
          except urllib.error.HTTPError as error:
              if error.code in (302, 303, 307, 308):
                  response = error
              else:
                  print("FAA returned HTTP", error.code, flush=True)
                  raise SystemExit(1)

          with response:
              print("FAA response status:", response.status, flush=True)
              print(
                  "Download link supplied:",
                  bool(response.headers.get("Location")),
                  flush=True,
              )
              print("Content type:", response.headers.get("Content-Type"), flush=True)

          print("Initial-load response test complete", flush=True)
          PY

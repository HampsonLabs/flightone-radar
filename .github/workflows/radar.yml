name: Radar

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may start scheduled runs a few minutes late
  workflow_dispatch: {}

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  actions: write            # lets the last step keep this schedule switched on
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python radar_job.py
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # GitHub switches off schedules in repositories with no activity for 60 days; this keeps it on.
      - if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/radar.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}

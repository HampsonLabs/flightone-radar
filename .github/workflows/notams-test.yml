
name: FAA NOTAM Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Test FAA authentication and connection
        env:
          NMS_CLIENT_ID: ${{ secrets.NMS_CLIENT_ID }}
          NMS_CLIENT_SECRET: ${{ secrets.NMS_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import urllib.parse
          import urllib.error

          host = "https://api-staging.cgifederal-aim.com"
          client_id = os.environ["NMS_CLIENT_ID"]
          client_secret = os.environ["NMS_CLIENT_SECRET"]

          print("Checking FAA staging authentication...", flush=True)

          import base64
          credentials = base64.b64encode(
              f"{client_id}:{client_secret}".encode()
          ).decode()

          data = urllib.parse.urlencode({
              "grant_type": "client_credentials"
          }).encode()

          request = urllib.request.Request(
              host + "/v1/auth/token",
              data=data,
              headers={
                  "Authorization": "Basic " + credentials,
                  "Content-Type": "application/x-www-form-urlencoded"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  import json
                  token = json.load(response)["access_token"]
              print("FAA authentication successful", flush=True)

              ping = urllib.request.Request(
                  host + "/nmsapi/v1/ping",
                  headers={"Authorization": "Bearer " + token}
              )

              with urllib.request.urlopen(ping, timeout=20) as response:
                  print("FAA ping successful: HTTP", response.status, flush=True)

          except urllib.error.HTTPError as error:
              print("FAA returned HTTP", error.code, flush=True)
              raise SystemExit(1)
          except Exception as error:
              print("Connection failed:", type(error).__name__, flush=True)
              raise SystemExit(1)
          PY
